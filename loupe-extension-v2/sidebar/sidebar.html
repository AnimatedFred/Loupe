<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Loupe — Prompt Preview</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap');

    :root {
      --bg: #ffffff;
      --bg2: #F7F6FB;
      --bg3: #f1f1f7;
      --border: #ECEBF2;
      --border2: #e2e8f0;
      --accent: #6366f1;
      --accent-light: #e0e7ff;
      --accent-dark: #4f46e5;
      --text: #1e293b;
      --text2: #475569;
      --text3: #94a3b8;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-sans: 'Outfit', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .header {
      padding: 16px 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      object-fit: cover;
      display: block;
    }

    .header-info { flex: 1; }
    .header-info h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
    .header-info p { font-size: 10px; color: var(--text3); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Context Bar */
    .context-bar {
      padding: 10px 20px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }

    .context-bar span {
      font-size: 11px; color: var(--text2); font-weight: 600;
    }

    .context-bar strong { color: var(--accent-dark); font-weight: 700; }

    /* Action Bar */
    .action-bar {
      padding: 16px 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .primary-btn {
      width: 100%;
      background: var(--accent);
      border: none; border-radius: 12px; color: white;
      cursor: pointer; padding: 14px;
      font-family: var(--font-sans); font-size: 14px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
    }
    .primary-btn:hover:not(:disabled) { background: var(--accent-dark); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3); }
    .primary-btn:active { transform: translateY(0); }
    .primary-btn:disabled { background: var(--bg3); color: var(--text3); box-shadow: none; cursor: not-allowed; }

    /* Preview Area */
    .preview-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      background: var(--bg2);
      display: flex;
      flex-direction: column;
    }

    .preview-area::-webkit-scrollbar { width: 6px; }
    .preview-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 10px; }

    .prompt-content {
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    /* Empty state */
    .empty-state {
      height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; text-align: center;
      color: var(--text3);
    }
    .empty-state .icon { font-size: 48px; opacity: 0.3; }
    .empty-state p { font-size: 14px; font-weight: 500; line-height: 1.5; max-width: 220px; color: var(--text2); }

    .footer {
      border-top: 1px solid var(--border);
      padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
      background: var(--bg);
    }
    .footer span {
      font-size: 11px; font-family: var(--font-mono);
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Screenshot Preview */
    #screenshot-preview {
      display: none;
      padding: 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .screenshot-container {
      width: 100%;
      aspect-ratio: 16/9;
      background: #f8fafc;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border2);
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      position: relative;
    }
    
    #screenshot-img { width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 0.3s; }
    #screenshot-img.loaded { opacity: 1; }

    .loading-status {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: var(--text3);
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
    }

    .screenshot-container.loading .loading-status { display: flex; }
  </style>
</head>
<body>

  <header class="header">
    <img class="logo-icon" src="../icons/icon128.png" alt="Loupe">
    <div class="header-info">
      <h1>Loupe</h1>
      <p id="headerSub">Context Preview</p>
    </div>
  </header>

  <div class="context-bar">
    <span><strong id="elemCount">0</strong> Elements Ready</span>
    <span id="pageTitle" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;color:var(--text3);"></span>
  </div>

  <div id="screenshot-preview">
    <div class="screenshot-container" id="screenshotContainer">
      <div class="loading-status">Capturing...</div>
      <img id="screenshot-img" alt="Captured view" />
    </div>
  </div>

  <div class="action-bar">
    <button class="primary-btn" id="copyBtn" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
      <span>Copy Prompt for AI</span>
    </button>
  </div>

  <div class="preview-area" id="previewArea">
    <div class="empty-state" id="emptyState">
      <div class="icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
      <p>Select elements on the page to build your AI prompt.</p>
    </div>
    <div class="prompt-content" id="promptContent" style="display:none;"></div>
  </div>

  <footer class="footer">
    <span>v2.0.0</span>
    <span>Local Bridge</span>
  </footer>

  <script src="../config.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
