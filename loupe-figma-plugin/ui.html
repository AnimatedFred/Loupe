<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --accent: #6366f1;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      overflow: hidden;
      width: 100%;
    }

    .title { font-size: 14px; font-weight: 700; margin-bottom: 16px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.2s;
    }
    .card.active { border-color: var(--accent); background: rgba(99,102,241,0.05); }

    .icon-box {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .card-info { flex: 1; }
    .card-label { font-size: 10px; font-weight: 600; color: var(--text-dim); margin-bottom: 2px; }
    .card-value { font-size: 13px; font-weight: 600; }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: #475569; flex-shrink: 0; }
    .dot.on  { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .dot.pulse { background: var(--accent); animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0   rgba(99,102,241,0.7); }
      70%  { box-shadow: 0 0 0 8px rgba(99,102,241,0); }
      100% { box-shadow: 0 0 0 0   rgba(99,102,241,0); }
    }

    button {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      margin-top: 12px;
      cursor: pointer;
      font-size: 13px;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.secondary {
      background: var(--surface);
      color: var(--text-dim);
      border: 1px solid var(--border);
      margin-top: 8px;
    }

    .feed {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      height: 100px;
      margin-top: 16px;
      padding: 10px 12px;
      font-size: 11px;
      overflow-y: auto;
    }
    .feed-title { font-size: 10px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .feed-row { display: flex; justify-content: space-between; margin-bottom: 5px; padding-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .feed-row:last-child { border-bottom: none; }
    .feed-time { color: var(--text-dim); }

    /* Sign-in screen */
    #view-signin {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      text-align: center;
      gap: 8px;
    }
    #view-signin .logo { font-size: 28px; margin-bottom: 4px; }
    #view-signin h2 { font-size: 16px; font-weight: 700; }
    #view-signin p { font-size: 12px; color: var(--text-dim); line-height: 1.5; }
    #view-signin button { margin-top: 16px; }
    #signin-status { font-size: 11px; color: var(--text-dim); margin-top: 8px; min-height: 16px; }

    #view-main { display: none; }
    #view-loading {
      display: flex; align-items: center; justify-content: center;
      min-height: 280px; color: var(--text-dim); font-size: 12px;
    }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="view-loading">Loading...</div>

  <!-- Sign-in -->
  <div id="view-signin" style="display:none">
    <div class="logo">🔍</div>
    <h2>Loupe Intelligence</h2>
    <p>Sign in to connect the Figma plugin<br>to your Loupe account.</p>
    <button id="btnSignIn">Sign in with Google</button>
    <div id="signin-status"></div>
    <button class="secondary" id="btnSignInCancel" style="display:none">Cancel</button>
  </div>

  <!-- Main UI -->
  <div id="view-main">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
      <div class="title" style="margin-bottom:0;">Intelligence Hub</div>
      <div style="display:flex; align-items:center; gap:8px;">
        <span id="tierBadge" style="font-size:10px; font-weight:700; padding:3px 8px; border-radius:100px; background:#1e293b; color:#94a3b8; border:1px solid #334155;">FREE</span>
        <button class="secondary" id="btnSignOut" style="width:auto; padding:3px 8px; font-size:10px; margin-top:0;">Sign out</button>
      </div>
    </div>

    <div class="card" id="extCard">
      <div class="icon-box">🔍</div>
      <div class="card-info">
        <div class="card-label">Extension Connection</div>
        <div class="card-value" id="extStatus">Waiting...</div>
      </div>
      <div class="dot" id="extDot"></div>
    </div>

    <div class="card" id="aiCard">
      <div class="icon-box">🧠</div>
      <div class="card-info">
        <div class="card-label">Claude AI Connection</div>
        <div class="card-value" id="aiStatus">Idle</div>
      </div>
      <div class="dot" id="aiDot"></div>
    </div>

    <button id="syncBtn" disabled>Sync Selection to Figma</button>

    <div class="feed">
      <div class="feed-title">Activity Feed</div>
      <div id="feedList" style="color: var(--text-dim);">Waiting for activity...</div>
    </div>
  </div>

  <script>
    const BRIDGE = 'https://web-production-9cce.up.railway.app';
    let session = null; // { accessToken, tier, email }
    let lastData = null;
    let lastProcessedAiId = 0;
    let lastProcessedSyncId = '';
    let lastProcessedQueryId = 0;
    let pollInterval = null;
    let oauthPollInterval = null;

    // ── Storage helpers (via code.js) ─────────────────────────────────────────
    const storageCallbacks = {};

    function storageGet(key) {
      return new Promise(resolve => {
        storageCallbacks[key] = resolve;
        parent.postMessage({ pluginMessage: { type: 'GET_STORAGE', key } }, '*');
      });
    }

    function storageSet(key, value) {
      parent.postMessage({ pluginMessage: { type: 'SET_STORAGE', key, value } }, '*');
    }

    function storageDel(key) {
      parent.postMessage({ pluginMessage: { type: 'DEL_STORAGE', key } }, '*');
    }

    // ── UI helpers ────────────────────────────────────────────────────────────
    function showView(name) {
      document.getElementById('view-loading').style.display = name === 'loading' ? '' : 'none';
      document.getElementById('view-signin').style.display  = name === 'signin'  ? '' : 'none';
      document.getElementById('view-main').style.display    = name === 'main'    ? '' : 'none';
    }

    function addLog(msg, type) {
      const feedList = document.getElementById('feedList');
      if (feedList.innerText.includes('Waiting')) feedList.innerHTML = '';
      const row = document.createElement('div');
      row.className = 'feed-row';
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      row.innerHTML = '<span style="color:' + (type === 'ai' ? '#818cf8' : '#10b981') + '">' + msg + '</span><span class="feed-time">' + time + '</span>';
      feedList.prepend(row);
    }

    function applyTierBadge(tier) {
      const isPro = tier === 'pro';
      const badge = document.getElementById('tierBadge');
      if (isPro) {
        badge.textContent = '⚡ PRO';
        badge.style.background = 'rgba(99,102,241,0.15)';
        badge.style.color = '#818cf8';
        badge.style.border = '1px solid rgba(99,102,241,0.3)';
      } else {
        badge.textContent = 'FREE';
        badge.style.background = '#1e293b';
        badge.style.color = '#94a3b8';
        badge.style.border = '1px solid #334155';
      }
    }

    // ── Bridge polling ────────────────────────────────────────────────────────
    async function checkState() {
      try {
        const headers = { 'Content-Type': 'application/json' };
        if (session && session.accessToken) {
          headers['Authorization'] = 'Bearer ' + session.accessToken;
        }
        const res = await fetch(BRIDGE + '/api/state?source=figma', { headers });
        if (!res.ok) throw new Error('offline');
        const data = await res.json();
        lastData = data;

        const isPro = data.tier === 'pro';
        applyTierBadge(data.tier);

        // Keep local session tier in sync
        if (session && session.tier !== data.tier) {
          session.tier = data.tier;
          storageSet('loupe_session', session);
        }

        // Sync button
        const syncBtn = document.getElementById('syncBtn');
        if (!isPro) {
          syncBtn.disabled = false;
          syncBtn.textContent = '⚡ Get Loupe Pro';
          syncBtn.onclick = function() { window.open(BRIDGE + '/#pricing', '_blank'); };
        } else {
          syncBtn.textContent = 'Sync Selection to Figma';
          syncBtn.onclick = function() {
            if (lastData && lastData.elements && lastData.elements.length > 0) {
              parent.postMessage({ pluginMessage: { type: 'IMPORT_ELEMENTS', elements: lastData.elements } }, '*');
              addLog('Sent ' + lastData.elements.length + ' elements to canvas');
            }
          };
        }

        // Extension status
        if (isPro && data.elements && data.elements.length > 0) {
          document.getElementById('extDot').className = 'dot on';
          document.getElementById('extStatus').textContent = 'Syncing ' + data.elements.length + ' elements';
          document.getElementById('extCard').classList.add('active');
          syncBtn.disabled = false;
          var syncId = (data.elements[0].rect && data.elements[0].rect.top || 0) + '-' + data.elements.length;
          if (syncId !== lastProcessedSyncId) {
            lastProcessedSyncId = syncId;
            addLog('Captured ' + data.elements.length + ' elements');
          }
        } else if (!isPro) {
          document.getElementById('extDot').className = 'dot';
          document.getElementById('extStatus').textContent = 'Pro plan required';
          document.getElementById('extCard').classList.remove('active');
        } else {
          document.getElementById('extDot').className = 'dot';
          document.getElementById('extStatus').textContent = 'Waiting for selection...';
          document.getElementById('extCard').classList.remove('active');
          if (isPro) syncBtn.disabled = true;
        }

        // AI commands
        if (data.aiMessage) {
          document.getElementById('aiDot').className = 'dot pulse';
          document.getElementById('aiStatus').textContent = 'Command Ready';
          document.getElementById('aiCard').classList.add('active');
          if (data.aiMessage.id > lastProcessedAiId) {
            lastProcessedAiId = data.aiMessage.id;
            addLog('AI: ' + data.aiMessage.type, 'ai');
            parent.postMessage({ pluginMessage: data.aiMessage }, '*');
          }
        } else {
          document.getElementById('aiDot').className = 'dot';
          document.getElementById('aiStatus').textContent = isPro ? 'Idle' : 'Pro plan required';
          document.getElementById('aiCard').classList.remove('active');
        }

        // Figma queries
        if (data.pendingQuery && data.pendingQuery.id > lastProcessedQueryId) {
          lastProcessedQueryId = data.pendingQuery.id;
          addLog('AI query #' + data.pendingQuery.id, 'ai');
          parent.postMessage({ pluginMessage: { type: 'FIGMA_QUERY', queryId: data.pendingQuery.id, code: data.pendingQuery.code } }, '*');
        }

      } catch (e) {
        document.getElementById('extStatus').textContent = 'Bridge Offline';
        document.getElementById('extDot').className = 'dot';
      }
    }

    function startPolling() {
      if (pollInterval) clearInterval(pollInterval);
      checkState();
      pollInterval = setInterval(checkState, 2000);
    }

    // ── OAuth flow ────────────────────────────────────────────────────────────
    function startOAuth() {
      var state = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
      document.getElementById('btnSignIn').disabled = true;
      document.getElementById('btnSignInCancel').style.display = '';
      document.getElementById('signin-status').textContent = 'Opening browser...';

      window.open(BRIDGE + '/auth/figma/start?state=' + state, '_blank');

      document.getElementById('signin-status').textContent = 'Waiting for sign-in...';

      var attempts = 0;
      var maxAttempts = 90; // 3 minutes
      oauthPollInterval = setInterval(async function() {
        attempts++;
        if (attempts > maxAttempts) {
          clearInterval(oauthPollInterval);
          document.getElementById('signin-status').textContent = 'Timed out. Try again.';
          document.getElementById('btnSignIn').disabled = false;
          document.getElementById('btnSignInCancel').style.display = 'none';
          return;
        }
        try {
          var res = await fetch(BRIDGE + '/api/auth/figma/session?state=' + state);
          if (res.status === 404) return; // still pending
          if (!res.ok) {
            clearInterval(oauthPollInterval);
            document.getElementById('signin-status').textContent = 'Sign-in failed. Try again.';
            document.getElementById('btnSignIn').disabled = false;
            document.getElementById('btnSignInCancel').style.display = 'none';
            return;
          }
          var data = await res.json();
          clearInterval(oauthPollInterval);
          session = { accessToken: data.accessToken, tier: data.tier, email: data.email };
          storageSet('loupe_session', session);
          showView('main');
          applyTierBadge(session.tier);
          startPolling();
          addLog('Signed in as ' + session.email);
        } catch (e) { /* network hiccup, retry */ }
      }, 2000);
    }

    function cancelOAuth() {
      if (oauthPollInterval) clearInterval(oauthPollInterval);
      document.getElementById('btnSignIn').disabled = false;
      document.getElementById('btnSignInCancel').style.display = 'none';
      document.getElementById('signin-status').textContent = '';
    }

    function signOut() {
      if (pollInterval) clearInterval(pollInterval);
      session = null;
      storageDel('loupe_session');
      showView('signin');
    }

    // ── Boot ──────────────────────────────────────────────────────────────────
    document.getElementById('btnSignIn').onclick = startOAuth;
    document.getElementById('btnSignInCancel').onclick = cancelOAuth;
    document.getElementById('btnSignOut').onclick = signOut;

    // Ask code.js for stored session
    showView('loading');
    storageGet('loupe_session');

    // ── Messages from code.js ─────────────────────────────────────────────────
    window.onmessage = async function(event) {
      var msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'STORAGE_VALUE') {
        var cb = storageCallbacks[msg.key];
        if (cb) {
          delete storageCallbacks[msg.key];
          cb(msg.value);
        }
        if (msg.key === 'loupe_session') {
          if (msg.value && msg.value.accessToken) {
            session = msg.value;
            showView('main');
            applyTierBadge(session.tier || 'free');
            startPolling();
          } else {
            showView('signin');
          }
        }
        return;
      }

      if (msg.type === 'QUERY_RESULT') {
        try {
          await fetch(BRIDGE + '/api/figma/result', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ queryId: msg.queryId, result: msg.result, error: msg.error })
          });
          addLog('Query #' + msg.queryId + ' answered', 'ai');
        } catch (e) {}
        return;
      }

      if (msg.type === 'SEND_SELECTION_TO_BRIDGE') {
        try {
          var headers2 = { 'Content-Type': 'application/json' };
          if (session && session.accessToken) headers2['Authorization'] = 'Bearer ' + session.accessToken;
          await fetch(BRIDGE + '/api/figma/selection', {
            method: 'POST',
            headers: headers2,
            body: JSON.stringify({ elements: msg.elements, context: { title: 'Figma Selection' } })
          });
          addLog('Pushed selection to AI bridge');
        } catch (e) {}
      }
    };
  </script>
</body>
</html>
