<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Subsrf — Prompt Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Azeret+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #050508;
      --panel:   #111118;
      --border:  rgba(255, 255, 255, 0.08);
      --accent:  #00FF87;
      --accent2: #00e87a;
      --text:    #F2F2F4;
      --muted:   rgba(242, 242, 244, 0.55);
      --success: #39D98A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Manrope', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Single header bar (Subsrf Studio style) ── */
    header {
      height: 64px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      flex-shrink: 0;
      z-index: 10;
    }

    /* Left third */
    .hd-left {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      object-fit: cover;
      display: block;
    }

    .hd-sep {
      width: 1px;
      height: 20px;
      background: var(--border);
      flex-shrink: 0;
    }

    .page-context {
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Center */
    .hd-center {
      flex-shrink: 0;
    }

    .toggle-group {
      display: flex;
      background: rgba(5, 5, 8, 0.5);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }

    .tog {
      padding: 6px 18px;
      border-radius: 7px;
      border: none;
      background: transparent;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Manrope', sans-serif;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .tog.active {
      background: var(--accent);
      color: #050508;
    }

    /* Right third */
    .hd-right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .status-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 100px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: #ffffff08;
      border: 1px solid var(--border);
      color: var(--muted);
      transition: all 0.3s;
      white-space: nowrap;
    }

    .status-chip.online {
      background: rgba(57, 217, 138, 0.1);
      border-color: rgba(57, 217, 138, 0.3);
      color: var(--success);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #475569;
      flex-shrink: 0;
      transition: all 0.3s;
    }

    .status-dot.on {
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
    }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Manrope', sans-serif;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-ghost {
      background: rgba(255,255,255,0.08);
      color: var(--text);
    }

    .btn-ghost:hover { background: rgba(255,255,255,0.12); }

    .btn-accent {
      background: var(--accent);
      color: #050508;
    }

    .btn-accent:hover { background: var(--accent2); }
    .btn-accent:disabled { opacity: 0.38; cursor: not-allowed; }
    .btn-accent:disabled:hover { background: var(--accent); }

    /* ── Body layout ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 256px;
      flex-shrink: 0;
      background: #111118;
      border-right: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-hd {
      padding: 16px 16px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(242, 242, 244, 0.4);
    }

    .big-count {
      font-size: 26px;
      font-weight: 800;
      color: var(--accent);
      line-height: 1.1;
      margin-top: 2px;
    }

    .el-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    .el-list::-webkit-scrollbar { width: 3px; }
    .el-list::-webkit-scrollbar-thumb { background: rgba(242,242,244,0.12); border-radius: 2px; }

    .el-card {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      cursor: pointer;
      transition: background 0.12s;
      border-left: 2px solid transparent;
    }

    .el-card:hover { background: rgba(255,255,255,0.03); }
    .el-card.active { background: rgba(0, 255, 135, 0.06); border-left-color: var(--accent); }

    .el-top {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .el-num {
      font-family: 'Azeret Mono', monospace;
      font-size: 9px;
      background: rgba(0, 255, 135, 0.1);
      color: #00FF87;
      border: 1px solid rgba(0, 255, 135, 0.25);
      padding: 2px 5px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .el-tag { font-weight: 700; font-size: 12px; color: #F2F2F4; }

    .el-cls {
      font-family: 'Azeret Mono', monospace;
      font-size: 10px;
      color: rgba(242, 242, 244, 0.55);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 130px;
    }

    .el-txt {
      font-size: 11px;
      color: rgba(242, 242, 244, 0.55);
      font-style: italic;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 4px;
    }

    .swatches {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .swatch {
      width: 13px;
      height: 13px;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }

    .swatch-dim {
      font-size: 9px;
      color: rgba(242, 242, 244, 0.4);
      font-family: 'Azeret Mono', monospace;
    }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0C0C12;
    }

    /* ── Output ── */
    .output-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }

    .output-wrap::-webkit-scrollbar { width: 6px; }
    .output-wrap::-webkit-scrollbar-track { background: transparent; }
    .output-wrap::-webkit-scrollbar-thumb { background: rgba(242,242,244,0.12); border-radius: 3px; }

    .output-box {
      background: #0C0C12;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .output-box-hd {
      padding: 9px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 6px;
      background: #111118;
    }

    .mac-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    pre.output {
      font-family: 'Azeret Mono', monospace;
      font-size: 12px;
      line-height: 1.8;
      color: rgba(242, 242, 244, 0.6);
      padding: 20px 22px;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
      background: #0C0C12;
    }

    /* Element section highlighting */
    .el-section {
      display: block;
      border-radius: 4px;
      transition: background 0.25s;
    }

    .el-section.hl {
      background: rgba(0, 255, 135, 0.05);
      outline: 1px solid rgba(0, 255, 135, 0.3);
      outline-offset: 1px;
      border-radius: 4px;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #111118;
      border: 1px solid rgba(255,255,255,0.08);
      color: #F2F2F4;
      padding: 9px 15px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(6px);
      transition: all 0.2s;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <header>
    <!-- Left: logo + page context -->
    <div class="hd-left">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 28 28" fill="none">
          <rect x="2" y="2" width="24" height="10" rx="2.5" fill="#00FF87"/>
          <rect x="2" y="16" width="24" height="10" rx="2.5" fill="#00FF87" opacity="0.4"/>
          <path d="M14 12v4M11 14l3 3 3-3" stroke="#050508" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Prompt Studio
      </div>
      <div class="hd-sep"></div>
      <div class="page-context" id="page-context">Loading...</div>
    </div>

    <!-- Center: mode toggle -->
    <div class="hd-center">
      <div class="toggle-group">
        <button class="tog active" id="tog-prompt">Prompt</button>
        <button class="tog" id="tog-css">CSS</button>
      </div>
    </div>

    <!-- Right: status + actions -->
    <div class="hd-right">
      <div class="status-chip" id="chip-mcp">
        <div class="status-dot" id="dot-mcp"></div>
        <span id="lbl-mcp">MCP OFFLINE</span>
      </div>
      <div class="status-chip" id="chip-figma">
        <div class="status-dot" id="dot-figma"></div>
        <span id="lbl-figma">FIGMA WAITING</span>
      </div>
      <div class="hd-sep"></div>
      <button class="btn btn-ghost" id="btn-copy">Copy</button>
      <button class="btn btn-accent" id="btn-push" disabled>Sync to Figma</button>
    </div>
  </header>

  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-hd">
        <div class="label">Selected Elements</div>
        <div class="big-count" id="el-count">0</div>
      </div>
      <div class="el-list" id="el-list">
        <div style="padding:28px 14px; text-align:center; font-size:11px; color:var(--muted);">No elements selected</div>
      </div>
    </aside>

    <!-- Main output -->
    <main class="main">
      <div class="output-wrap">
        <div class="output-box">
          <div class="output-box-hd">
            <div class="mac-dot" style="background:#ef4444;"></div>
            <div class="mac-dot" style="background:#f59e0b;"></div>
            <div class="mac-dot" style="background:#10b981;"></div>
            <span style="font-size:11px; color:rgba(242,242,244,0.4); margin-left:8px; font-family:'Azeret Mono',monospace;" id="output-label">subsrf-brief.txt</span>
          </div>
          <pre class="output" id="output">Loading...</pre>
        </div>
      </div>
    </main>

  </div>

  <div class="toast" id="toast"></div>
  <script src="prompt.js"></script>
</body>
</html>
