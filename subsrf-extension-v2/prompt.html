<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Subsrf — Prompt Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;700&family=Manrope:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --neon: #00FF87;
      --neon-dim: rgba(0, 255, 135, 0.10);
      --void: #050508;
      --deep: #0C0C12;
      --layer: #111118;
      --border: rgba(242, 242, 244, 0.08);
      --border-md: rgba(242, 242, 244, 0.12);
      --t1: #F2F2F4;
      --t2: rgba(242, 242, 244, 0.55);
      --t3: rgba(242, 242, 244, 0.28);
      --t4: rgba(242, 242, 244, 0.10);
      --ok: #39D98A;
      --warn: #FFAB00;
      --err: #FF4D4D;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Manrope', sans-serif;
      background: var(--void);
      color: var(--t1);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--void);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--layer);
      border: 1px solid var(--border);
    }

    /* ── Header ── */
    header {
      height: 64px;
      flex-shrink: 0;
      background: var(--layer);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }

    .hd-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .hd-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1;
      color: var(--t1);
    }

    #page-context {
      font-family: 'Azeret Mono', monospace;
      font-size: 10px;
      color: var(--t3);
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 3px;
    }

    .hd-chips {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      font-family: 'Azeret Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--t3);
      white-space: nowrap;
    }

    .status-chip.online {
      border-color: rgba(57, 217, 138, 0.3);
      color: var(--ok);
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--t4);
      flex-shrink: 0;
    }

    .status-dot.on {
      background: var(--ok);
    }

    .hd-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-copy {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--neon);
      color: var(--void);
      font-family: 'Azeret Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-copy:hover {
      opacity: 0.85;
    }

    .btn-copy .material-symbols-outlined {
      font-size: 14px;
      line-height: 1;
    }

    /* ── 3-pane workspace ── */
    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── Left pane ── */
    .pane-left {
      width: 288px;
      flex-shrink: 0;
      background: var(--layer);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pane-left-hd {
      padding: 24px 24px 20px;
      border-bottom: 1px solid var(--border);
    }

    .label-caps {
      font-family: 'Azeret Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--t3);
    }

    .big-count {
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -3px;
      color: var(--neon);
      line-height: 1;
      margin-top: 6px;
    }

    .el-list {
      flex: 1;
      overflow-y: auto;
    }

    .el-card {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      border-left: 2px solid transparent;
      cursor: pointer;
      transition: background 0.1s;
    }

    .el-card:hover {
      background: rgba(242, 242, 244, 0.03);
    }

    .el-card.active {
      background: var(--neon-dim);
      border-left-color: var(--neon);
    }

    .el-top {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
    }

    .el-num {
      font-family: 'Azeret Mono', monospace;
      font-size: 9px;
      background: var(--neon-dim);
      color: var(--neon);
      border: 1px solid rgba(0, 255, 135, 0.25);
      padding: 2px 5px;
      flex-shrink: 0;
    }

    .el-tag {
      font-weight: 700;
      font-size: 12px;
      color: var(--t1);
    }

    .el-cls {
      font-family: 'Azeret Mono', monospace;
      font-size: 10px;
      color: var(--t2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 120px;
    }

    .el-dim {
      font-family: 'Azeret Mono', monospace;
      font-size: 9px;
      color: var(--t3);
      margin-left: auto;
      flex-shrink: 0;
    }

    .el-txt {
      font-size: 11px;
      color: var(--t2);
      font-style: italic;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Center pane ── */
    .pane-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--deep);
    }

    .tabs-bar {
      display: flex;
      align-items: stretch;
      background: var(--layer);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 16px;
      border-right: 1px solid var(--border);
      border-bottom: 2px solid transparent;
      font-family: 'Azeret Mono', monospace;
      font-size: 12px;
      color: var(--t3);
      cursor: pointer;
      transition: color 0.12s;
      background: transparent;
      border-top: none;
      border-left: none;
    }

    .tab:hover {
      color: var(--t2);
    }

    .tab.active {
      color: var(--t1);
      border-bottom-color: var(--neon);
      background: var(--deep);
    }

    .tab .material-symbols-outlined {
      font-size: 14px;
      line-height: 1;
    }

    .output-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .output-filename {
      font-family: 'Azeret Mono', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--t3);
      margin-bottom: 8px;
    }

    .output-box {
      background: var(--deep);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    pre.output {
      font-family: 'Azeret Mono', monospace;
      font-size: 12px;
      line-height: 1.8;
      color: var(--t2);
      padding: 20px 24px;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
      min-height: 200px;
    }

    .el-section {
      display: block;
      transition: background 0.2s;
    }

    .el-section.hl {
      background: rgba(0, 255, 135, 0.05);
      outline: 1px solid rgba(0, 255, 135, 0.3);
      outline-offset: 1px;
    }

    /* ── Right pane ── */
    .pane-right {
      width: 288px;
      flex-shrink: 0;
      background: var(--layer);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #ai-gate {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow-y: auto;
    }

    /* Paid: column layout in right pane */
    .ai-engine-bar {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
      flex: 1;
    }

    .ai-engine-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Azeret Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--t3);
    }

    .credit-badge {
      font-family: 'Azeret Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      background: var(--neon-dim);
      border: 1px solid rgba(0, 255, 135, 0.25);
      color: var(--neon);
    }

    .credit-badge.low {
      background: rgba(255, 171, 0, 0.08);
      border-color: rgba(255, 171, 0, 0.3);
      color: var(--warn);
    }

    .credit-badge.empty {
      background: var(--t4);
      border-color: var(--border);
      color: var(--t3);
    }

    .btn-generate {
      width: 100%;
      padding: 13px 16px;
      background: var(--neon);
      color: var(--void);
      font-family: 'Azeret Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s;
    }

    .btn-generate:hover {
      opacity: 0.85;
    }

    .btn-generate:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Free: upgrade panel */
    .upgrade-banner {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .upgrade-text {
      font-size: 12px;
      color: var(--t2);
      line-height: 1.65;
    }

    .upgrade-text strong {
      color: var(--t1);
      font-weight: 700;
    }

    .btn-upgrade-sm {
      width: 100%;
      padding: 11px 16px;
      background: transparent;
      border: 1px solid rgba(0, 255, 135, 0.35);
      color: var(--neon);
      font-family: 'Manrope', sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-upgrade-sm:hover {
      background: var(--neon-dim);
      border-color: rgba(0, 255, 135, 0.6);
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--layer);
      border: 1px solid var(--border);
      color: var(--t1);
      padding: 9px 16px;
      font-family: 'Azeret Mono', monospace;
      font-size: 11px;
      opacity: 0;
      transform: translateY(6px);
      transition: all 0.2s;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body>

  <header>
    <div class="hd-left">
      <div>
        <div class="hd-title">Prompt Studio</div>
        <div id="page-context">Loading...</div>
      </div>
      <div class="hd-chips">
        <div class="status-chip" id="chip-mcp">
          <div class="status-dot" id="dot-mcp"></div>
          <span id="lbl-mcp">MCP OFFLINE</span>
        </div>
        <div class="status-chip" id="chip-figma">
          <div class="status-dot" id="dot-figma"></div>
          <span id="lbl-figma">FIGMA WAITING</span>
        </div>
      </div>
    </div>
    <div class="hd-right">
      <button class="btn-copy" id="btn-copy">
        <span class="material-symbols-outlined">content_copy</span>
        Copy Output
      </button>
    </div>
  </header>

  <div class="workspace">

    <!-- Left pane: Elements -->
    <aside class="pane-left">
      <div class="pane-left-hd">
        <div class="label-caps">Selected Elements</div>
        <div class="big-count" id="el-count">0</div>
      </div>
      <div class="el-list" id="el-list">
        <div style="padding:32px 16px; text-align:center; font-size:11px; color:var(--t3);">No elements selected</div>
      </div>
    </aside>

    <!-- Center pane: Output -->
    <section class="pane-center">
      <div class="tabs-bar">
        <button class="tab active" id="tog-prompt">
          <span class="material-symbols-outlined">description</span>
          Prompt
        </button>
        <button class="tab" id="tog-css">
          <span class="material-symbols-outlined">code</span>
          CSS
        </button>
      </div>
      <div class="output-wrap">
        <div class="output-filename" id="output-label">Prompt</div>
        <div class="output-box" id="output-box">
          <pre class="output" id="output">Loading...</pre>
        </div>
      </div>
    </section>

    <!-- Right pane: AI Controls -->
    <aside class="pane-right">
      <div id="ai-gate"></div>
    </aside>

  </div>

  <div class="toast" id="toast"></div>
  <script src="prompt.js"></script>
</body>

</html>
